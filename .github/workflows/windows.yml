name: Build (Windows)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          check-latest: true

      - name: Set up Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Build Node N-API addon
        shell: pwsh
        run: |
          cd native/node-winapi
          npm install --ignore-scripts
          # Patch node-gyp to support Visual Studio 18+ (2026 preview)
          $findVs = "node_modules/node-gyp/lib/find-visualstudio.js"
          if (Test-Path $findVs) {
            (Get-Content $findVs) -replace 'ret\.versionMajor === 17', 'ret.versionMajor >= 17' | Set-Content $findVs
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = $null
          if (Test-Path $vswhere) {
            $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath) | Select-Object -First 1
          }
          Write-Host "Found VS at: $vsInstall"
          if ($vsInstall) {
            $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvars64.bat"
            if (Test-Path $vcvars) {
              Write-Host "Invoking vcvars64.bat and node-gyp rebuild..."
              cmd /c "`"$vcvars`" && set VSCMD_VER=17.12.0 && npx node-gyp rebuild --msvs_version=2022"
            } else {
              npx node-gyp rebuild
            }
          } else {
            npx node-gyp rebuild
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test Windows target
        run: >
          ./gradlew
          mingwX64Test
          jvmTest
          jsNodeTest
          --no-configuration-cache

      - name: Upload test reports (Windows)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
